name: ProgramaSpike
options:
  bundleIdPrefix: com.darkroom.programa
packages:
  CmuxIrohTransport:
    path: ../../vendor/CmuxIrohTransport
  iroh-ffi:
    url: https://github.com/manaflow-ai/iroh-ffi.git
    exactVersion: 1.0.2-cmux.3
targets:
  ProgramaSpike:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: ProgramaSpike
    dependencies:
      - package: CmuxIrohTransport
        product: CmuxIrohTransport
      - package: iroh-ffi
        product: IrohLib
      - target: ProgramaSpikeWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.darkroom.programa.spike
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        # Set by scripts/build-ios-testflight.sh before `xcodegen generate`, from
        # the name inside the actual installed profile. It has to live here rather
        # than on the xcodebuild command line: a command-line build setting applies
        # to every target, and the app and the widget need *different* profiles.
        # Without it, a manual-signing archive fails with "requires a provisioning
        # profile with the iCloud and Push Notifications features".
        # Unset locally, where it stays an undefined build-setting reference and
        # expands to empty -- harmless, since local builds pass
        # CODE_SIGNING_ALLOWED=NO and Xcode itself uses automatic signing.
        PROVISIONING_PROFILE_SPECIFIER: ${PROGRAMA_IOS_APP_PROFILE_NAME}
        # Black-and-white treatment of the macOS Programa mark.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    # Every Info.plist key is declared here, explicitly, rather than via
    # INFOPLIST_KEY_* build settings. Two reasons, both learned the hard way:
    #
    # 1. Xcode synthesises only a fixed allow-list of INFOPLIST_KEY_* names.
    #    UIBackgroundModes is NOT on it: the setting is accepted silently and the
    #    key never reaches the built plist. Verified on device -- the key was
    #    absent from ProgramaSpike.app/Info.plist and iOS logged "you still need
    #    to add "remote-notification" to the list of your supported
    #    UIBackgroundModes". Same trap as INFOPLIST_KEY_NSExtensionPointIdentifier.
    # 2. Declaring `info.path` sets INFOPLIST_FILE, which turns the INFOPLIST_KEY_*
    #    synthesis off entirely -- so mixing the two styles silently DROPS every
    #    key still expressed the old way. That is how NSLocalNetworkUsageDescription
    #    briefly went missing here, which does not fail the build; it just makes
    #    iOS deny local-network access and forces every connection onto a relay.
    #
    # Both failure modes are silent. After changing anything below, verify against
    # the built app, not the source:
    #   plutil -extract UIBackgroundModes json -o - <app>/Info.plist
    info:
      path: ProgramaSpike/Info.plist
      properties:
        CFBundleDisplayName: "Programa"
        UILaunchScreen: {}
        # Required, not optional: TARGETED_DEVICE_FAMILY is "1,2" so the app
        # claims iPad support, and App Store validation HARD FAILS an iPad-capable
        # bundle that declares no orientations ("Invalid bundle. No orientations
        # were specified"). It surfaces during archive only as a warning
        # ("All interface orientations must be supported unless the app requires
        # full screen"), so it is easy to ship past locally and only discover at
        # upload.
        #
        # iPad gets all four because that is what iPad multitasking requires.
        # iPhone omits upside-down, which is conventional and what Apple's own
        # apps do. If this ever becomes iPhone-only, drop TARGETED_DEVICE_FAMILY
        # to "1" and the ~ipad variant with it.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Export-compliance declaration required by App Store Connect. The app
        # uses only standard QUIC/TLS (via iroh) and Apple's own CloudKit --
        # no proprietary or non-standard cryptography -- which is the exempt
        # case. This is a legal declaration by the publisher: confirm it before
        # the first upload rather than treating it as a build setting.
        ITSAppUsesNonExemptEncryption: false
        # Without this, iOS silently denies the app any local-network access
        # and iroh cannot reach the Mac's LAN address from the pairing ticket,
        # so the connection falls back to a relay even on the same Wi-Fi.
        # Measured: phone reported `relay` until this key was added.
        NSLocalNetworkUsageDescription: "Programa connects directly to your Mac on the same network instead of routing through a relay."
        # Used only by the pairing screen's "Scan QR Code" button, to read the
        # pairing code shown in Programa's Mac Settings ▸ Phone screen.
        NSCameraUsageDescription: "Programa uses the camera to scan the pairing QR code shown in Programa's Mac Settings ▸ Phone screen."
        # Required for ActivityKit -- without this the app can request a Live
        # Activity but the system silently refuses to start it.
        NSSupportsLiveActivities: true
        # M3: lets a silent (content-available) CloudKit push wake the app in the
        # background to refresh the Live Activity.
        UIBackgroundModes:
          - remote-notification
    entitlements:
      path: ProgramaSpike/ProgramaSpike.entitlements
      properties:
        # Required for registerForRemoteNotifications() to succeed at all, which
        # CloudKit needs before it can deliver a CKQuerySubscription push. Without
        # it the app launches fine and fails at runtime with NSCocoaErrorDomain
        # 3000 "no valid aps-environment entitlement string found for
        # application", and no push ever arrives. Also requires Push Notifications
        # enabled on App ID com.darkroom.programa.spike in the Developer portal.
        # Xcode rewrites this to "production" when signing for distribution.
        aps-environment: development
        com.apple.developer.icloud-container-identifiers:
          # Shared with the macOS app so the Mac can write and the phone can
          # read the same records. Requires a one-time Developer portal step:
          # the container must exist and iCloud must be enabled on BOTH App IDs
          # (com.darkroom.programa and com.darkroom.programa.spike). Xcode's
          # automatic signing cannot create a container whose name does not
          # match the bundle id, so `-allowProvisioningUpdates` will not do it.
          - iCloud.com.darkroom.programa
        com.apple.developer.icloud-services:
          - CloudKit
        # Which CloudKit environment the signed build talks to. Unlike
        # aps-environment -- which Xcode rewrites from development to production
        # when signing for distribution -- this key is NOT injected: leaving it
        # out produces a signed binary with no such entitlement at all, and
        # build-ios-testflight.sh refuses to upload because it cannot confirm the
        # build would reach the same container the Mac writes to.
        # Declared as Production because that is the only environment that
        # interoperates with the distributed macOS app. The App Store profile
        # permits both values (it carries them as an array), so this signs fine.
        com.apple.developer.icloud-container-environment: Production

  ProgramaSpikeWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: ProgramaSpikeWidgets
      - path: ProgramaSpike/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.darkroom.programa.spike.widgets
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        # The widget needs its own profile, not the app's -- see the note on the
        # app target's PROVISIONING_PROFILE_SPECIFIER for why this cannot be
        # passed on the xcodebuild command line.
        PROVISIONING_PROFILE_SPECIFIER: ${PROGRAMA_IOS_WIDGET_PROFILE_NAME}
        # An app extension must ship a real nested NSExtension dictionary.
        # INFOPLIST_KEY_* only synthesises a documented allowlist of flat keys,
        # so NSExtensionPointIdentifier never nests and iOS refuses to install
        # the .appex ("does not define an NSExtension dictionary").
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: ProgramaSpikeWidgets/Info.plist
      properties:
        CFBundleDisplayName: Programa Widgets
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
