name: iOS build

# Compile check for the iOS companion app. Deliberately UNSIGNED, so it needs no
# secrets and stays green even while the TestFlight signing material is not yet
# configured — the point is to catch "the companion no longer compiles" at PR
# time, which is otherwise invisible: ci.yml does not build ios/** at all.
#
# This lives in its own workflow rather than as a job in ci.yml on purpose.
# ci.yml's change-detection treats any non-docs path as app-relevant and turns on
# the full macOS suite (unit tests, socket integration, typing-lag, UI
# regressions). Adding ios/** to its path filter would run all of that for an
# iOS-only change, which is minutes of macOS runner time for no signal.
on:
  push:
    branches:
      - main
    paths:
      - "ios/**"
      - "vendor/CmuxIrohTransport/**"
      - "scripts/build-ios-testflight.sh"
      - ".github/workflows/ios-build.yml"
  pull_request:
    paths:
      - "ios/**"
      - "vendor/CmuxIrohTransport/**"
      - "scripts/build-ios-testflight.sh"
      - ".github/workflows/ios-build.yml"

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build companion (unsigned)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        # No submodules: the companion depends on vendor/CmuxIrohTransport
        # (vendored in-tree) and iroh-ffi via SwiftPM. It does not need ghostty.

      - name: Select Xcode
        run: |
          set -euo pipefail
          XCODE_APP="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort | tail -n 1)"
          if [ -z "$XCODE_APP" ]; then XCODE_APP="/Applications/Xcode.app"; fi
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          echo "DEVELOPER_DIR=$XCODE_APP/Contents/Developer" >> "$GITHUB_ENV"
          echo "Selected: $XCODE_APP"

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate project
        run: |
          set -euo pipefail
          cd ios/ProgramaSpike
          xcodegen generate

      # iroh-ffi resolves to a checksummed prebuilt binary xcframework, so this
      # is a download rather than a Rust build, but it is still worth caching.
      - name: Cache SwiftPM
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .ios-build/source-packages
          key: ios-spm-${{ runner.os }}-${{ hashFiles('ios/ProgramaSpike/project.yml') }}
          restore-keys: |
            ios-spm-${{ runner.os }}-

      - name: Build
        run: |
          set -euo pipefail
          # Device destination rather than a simulator one: it matches what the
          # TestFlight archive actually builds (arm64 device slice), and avoids
          # depending on which simulator runtimes happen to be installed on the
          # runner image.
          xcodebuild \
            -project ios/ProgramaSpike/ProgramaSpike.xcodeproj \
            -scheme ProgramaSpike \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -clonedSourcePackagesDirPath .ios-build/source-packages \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
