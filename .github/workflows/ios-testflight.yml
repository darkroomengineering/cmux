name: iOS TestFlight

# Auto-ships the companion, matching the macOS lane's philosophy: anything that
# lands on main goes out, and breakage is fixed forward rather than gated behind
# a manual step nobody remembers to run. (This lane was manual-only until the
# companion was actually in testers' hands; it never once ran, which is precisely
# the failure mode that argues for automation.)
#
# Path-filtered rather than triggered on CI success. Two reasons: a macOS CI pass
# says nothing about whether the companion compiles (this lane shares no build
# with it and does not even check out the ghostty submodule), and a macOS-only
# merge should not spend ~45 minutes of macOS runner time or push a pointless
# build to testers. `push` supports paths natively, so no commit-range guesswork.
#
# A push here always uploads. workflow_dispatch still defaults to build-and-verify
# only, which is the safe way to check the pipeline without consuming a build
# number or notifying testers.
on:
  push:
    branches:
      - main
    paths:
      - "ios/**"
      - "vendor/CmuxIrohTransport/**"
      - "scripts/build-ios-testflight.sh"
      - ".github/workflows/ios-testflight.yml"
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload to TestFlight (false = build and verify only)"
        type: boolean
        default: false

concurrency:
  # Build numbers must be monotonic and are derived from the run id, so two
  # concurrent runs would race for the same slot in App Store Connect.
  group: ios-testflight
  cancel-in-progress: false

jobs:
  # Decide, on a free ubuntu runner, whether this repo can sign at all — before
  # spending a macOS runner on an archive that cannot be exported.
  #
  # The two trigger types want opposite behaviour when credentials are absent:
  #   push  — "not configured yet" is a known setup state, not a regression. A red
  #           X on main for it trains people to ignore red, so warn loudly and skip.
  #   dispatch — someone deliberately asked to ship. Fail so they see why.
  preflight:
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Check signing material
        id: check
        env:
          IOS_DIST_CERT_BASE64: ${{ secrets.APPLE_IOS_DIST_CERT_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.APPLE_IOS_DIST_CERT_PASSWORD }}
          IOS_APP_PROFILE_BASE64: ${{ secrets.APPLE_IOS_APP_PROFILE_BASE64 }}
          IOS_WIDGET_PROFILE_BASE64: ${{ secrets.APPLE_IOS_WIDGET_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          missing=""
          for v in IOS_DIST_CERT_BASE64 IOS_DIST_CERT_PASSWORD IOS_APP_PROFILE_BASE64 IOS_WIDGET_PROFILE_BASE64; do
            [ -z "${!v}" ] && missing="$missing APPLE_$v"
          done

          if [ -z "$missing" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Signing material present." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "configured=false" >> "$GITHUB_OUTPUT"

          # Spell out the fix rather than the symptom: this cannot be fixed by
          # editing the repo. The material has to be exported from the Apple
          # Developer portal by a human with account access.
          {
            echo "## Companion NOT shipped — iOS signing is not configured"
            echo ""
            echo "Missing repository secret(s):\`$missing\`"
            echo ""
            echo "Add these under **Settings > Secrets and variables > Actions**:"
            echo ""
            echo '| secret | what it is |'
            echo '|---|---|'
            echo '| `APPLE_IOS_DIST_CERT_BASE64` | Apple **Distribution** certificate as `.p12`, base64. A Developer ID or Apple Development cert cannot sign for TestFlight. |'
            echo '| `APPLE_IOS_DIST_CERT_PASSWORD` | the `.p12` export password |'
            echo '| `APPLE_IOS_APP_PROFILE_BASE64` | **App Store** profile for `com.darkroom.programa.spike`, base64. Must be minted with Push Notifications enabled on the App ID, or the build fails later on `aps-environment != production`. |'
            echo '| `APPLE_IOS_WIDGET_PROFILE_BASE64` | App Store profile for `com.darkroom.programa.spike.widgets` |'
            echo '| `APPSTORE_CONNECT_KEY_ID` | App Store Connect API key id (upload only) |'
            echo '| `APPSTORE_CONNECT_ISSUER_ID` | App Store Connect issuer id (upload only) |'
            echo '| `APPSTORE_CONNECT_KEY_P8_BASE64` | the `.p8` key, base64 (upload only) |'
            echo ""
            echo 'Encode each file with `base64 -i <file> | pbcopy`.'
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::warning title=iOS companion not shipped::Signing secrets are missing, so no TestFlight build was produced. See the run summary for the exact list."

          if [ "${{ github.event_name }}" != "push" ]; then
            echo "Refusing an explicitly requested ship with no signing material." >&2
            exit 1
          fi
          echo "Automatic trigger: skipping the build rather than failing main."

  build:
    needs: preflight
    if: needs.preflight.outputs.configured == 'true'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        # No submodules: the iOS app depends on vendor/CmuxIrohTransport, which is
        # vendored in-tree, and on iroh-ffi via SwiftPM. It does not need the
        # ghostty submodule, and skipping it saves several minutes.

      - name: Select Xcode
        run: |
          set -euo pipefail
          XCODE_APP="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort | tail -n 1)"
          if [ -z "$XCODE_APP" ]; then XCODE_APP="/Applications/Xcode.app"; fi
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          echo "DEVELOPER_DIR=$XCODE_APP/Contents/Developer" >> "$GITHUB_ENV"
          echo "Selected: $XCODE_APP"

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Materialise signing assets
        env:
          IOS_DIST_CERT_BASE64: ${{ secrets.APPLE_IOS_DIST_CERT_BASE64 }}
          IOS_APP_PROFILE_BASE64: ${{ secrets.APPLE_IOS_APP_PROFILE_BASE64 }}
          IOS_WIDGET_PROFILE_BASE64: ${{ secrets.APPLE_IOS_WIDGET_PROFILE_BASE64 }}
          ASC_KEY_P8_BASE64: ${{ secrets.APPSTORE_CONNECT_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          # The preflight job already gated on these and explained how to supply
          # them, so this is only defence in depth against the two jobs drifting
          # apart. Keep it terse; preflight owns the guidance.
          for v in IOS_DIST_CERT_BASE64 IOS_APP_PROFILE_BASE64 IOS_WIDGET_PROFILE_BASE64; do
            if [ -z "${!v}" ]; then
              echo "APPLE_$v is empty but preflight reported configured=true." >&2
              exit 1
            fi
          done
          mkdir -p "$RUNNER_TEMP/signing"
          echo "$IOS_DIST_CERT_BASE64"      | base64 --decode > "$RUNNER_TEMP/signing/dist.p12"
          echo "$IOS_APP_PROFILE_BASE64"    | base64 --decode > "$RUNNER_TEMP/signing/app.mobileprovision"
          echo "$IOS_WIDGET_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/signing/widget.mobileprovision"
          if [ -n "$ASC_KEY_P8_BASE64" ]; then
            echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/signing/asc.p8"
          fi

      - name: Build, sign and verify
        env:
          PROGRAMA_IOS_DIST_CERT_P12: ${{ runner.temp }}/signing/dist.p12
          PROGRAMA_IOS_DIST_CERT_PASSWORD: ${{ secrets.APPLE_IOS_DIST_CERT_PASSWORD }}
          PROGRAMA_IOS_APP_PROFILE: ${{ runner.temp }}/signing/app.mobileprovision
          PROGRAMA_IOS_WIDGET_PROFILE: ${{ runner.temp }}/signing/widget.mobileprovision
          PROGRAMA_IOS_TEAM_ID: ZNHHMX2RP6
          PROGRAMA_ASC_KEY_ID: ${{ secrets.APPSTORE_CONNECT_KEY_ID }}
          PROGRAMA_ASC_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_ISSUER_ID }}
          PROGRAMA_ASC_KEY_P8: ${{ runner.temp }}/signing/asc.p8
          # A push to main always uploads; workflow_dispatch honours its input and
          # defaults to verify-only.
          PROGRAMA_IOS_UPLOAD: ${{ github.event_name == 'push' && '1' || (inputs.upload && '1' || '0') }}
        run: |
          set -euo pipefail
          # Monotonic and unique per run, matching the macOS release lane. App Store
          # Connect rejects a reused CFBundleVersion, and the committed value in
          # project.yml is only a local-dev default.
          RUN_ATTEMPT="$(printf '%02d' "${GITHUB_RUN_ATTEMPT:-1}")"
          export PROGRAMA_IOS_BUILD_NUMBER="${GITHUB_RUN_ID}${RUN_ATTEMPT}"
          echo "Build number: $PROGRAMA_IOS_BUILD_NUMBER"
          chmod +x scripts/build-ios-testflight.sh
          ./scripts/build-ios-testflight.sh

      - name: Upload ipa artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: programa-ios-${{ github.run_id }}
          path: .ios-build/export/*.ipa
          if-no-files-found: warn
          retention-days: 14

      - name: Clean up signing material
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/signing" "$HOME/private_keys" || true
          security delete-keychain ios-build.keychain >/dev/null 2>&1 || true
